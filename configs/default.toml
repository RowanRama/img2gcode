# img2gcode configuration.
#
# Every key is optional: a missing key takes the value shown here. Print this
# file with `img2gcode config > my.toml`, edit it, and pass it with -c.
# Any key can also be set on the command line: --set infill.density=60

# "fill": one tool per colour, each region drawn as perimeters + infill.
#         Best for logos, text, flat-colour art and SVGs.
# "edge": edge detection traced as continuous strokes. Best for photos and
#         portraits where internal detail (eyes, hair) matters.
mode = "fill"

# Rectangles where fill mode leaves out infill (perimeters still print), as
# [x0, y0, x1, y1] fractions of the image, 0..1 from the top-left corner.
# The GUI draws these for you.
exclusions = []

[canvas]
# Print area in mm. The image is scaled to fit inside it, aspect ratio kept.
width = 1000.0
height = 700.0
# Where the centre of the print lands on the machine (mm).
center_x = 0.0
center_y = 0.0

[machine]
travel_speed = 7800.0   # mm/min
print_speed = 1800.0    # mm/min
z_lift = 1.0            # mm lifted for every travel move

[extrusion]
filament_diameter = 1.75   # mm
nozzle_diameter = 4.0      # mm
line_width = 0.0           # mm; 0 = nozzle diameter
multiplier = 1.0

[layers]
count = 1
height = 3.0              # mm
perimeters = 1            # outline loops per region before the infill
# Where the outer perimeter's centre line sits, in line widths inside the
# shape's edge. 0.5 keeps the printed edge on the image edge. 0 centres the
# line on the edge, so features thinner than a line still print but every
# shape grows by half a line.
perimeter_inset = 0.5

[image]
tools = 2                 # colours found by K-means (raster images only;
                          # a plain-colour SVG gets one tool per fill colour)
white_threshold = 220     # pixels with R, G and B all above this are background
min_area = 10             # px; smaller specks of a colour are dropped
resolution = 1200         # images are resampled so their longest side is
                          # this many px before processing
trim = true               # crop background margins first, so the drawing
                          # itself (not the page around it) fills the canvas
# Placement: the image is fitted to the canvas, then scaled by `scale` and
# moved by (x, y) mm from the canvas centre. Dragging it in the GUI sets these.
x = 0.0
y = 0.0
scale = 1.0

[infill]
density = 100.0           # %; line spacing = line width / (density / 100)
spacing = 0.0             # mm; when > 0 it replaces density
angle = -45.0             # degrees from +X, counter-clockwise; +90 each layer
connect = true            # join neighbouring lines into one serpentine path
overlap = 0.25            # line widths the infill overlaps the last perimeter

[path]
smoothing = 1.0           # px; Gaussian blur of outlines and strokes. Higher
                          # is smoother and rounds corners more. 0 = off
tolerance = 0.05          # mm; points are dropped while the path stays within
                          # this distance of the smooth curve

[edge]
# Contrast boost (CLAHE) before detection; 0 disables. Raise to 3-4 for flat
# images, lower toward 0.5-1 if skin texture starts showing.
clahe_clip = 1.5
clahe_grid = 8
# Edge-preserving denoise; bilateral_d = 0 disables.
bilateral_d = 5
bilateral_sigma_color = 35.0
bilateral_sigma_space = 35.0
# Canny thresholds; both 0 = automatic (Otsu).
canny_low = 0
canny_high = 0
# Blur sigmas (px) Canny runs at; their edges are combined. 0 catches the
# finest texture, 2 the structural edges.
scales = [0.2, 1.0, 2.0]
# Keep only edges on or near the non-white subject.
restrict_to_foreground = false
foreground_dilate = 3     # px
# Edges closer than collapse x line width merge into one stroke. 0 = off.
collapse = 0.0
# A stroke is cut where it would print within min_separation x line width of
# a stroke already drawn, so the nozzle never retraces a line.
min_separation = 0.8
# Stroke ends closer than chain_gap x line width are joined into one path.
chain_gap = 1.5
min_length = 4.0          # px; shorter strokes are dropped
tool = 0                  # tool that draws the strokes

[gcode]
# Text emitted as-is. Placeholders: {travel_speed} {print_speed}, and {tool}
# in tool_change.
start = """
M104 S200 ; set temperature
G28 ; home all axes
G1 Z5 F{travel_speed} ; lift nozzle
M109 S200 ; set temperature and wait
G21 ; millimetres
G90 ; absolute coordinates
M82 ; absolute extrusion
G92 E0
M107
"""
tool_change = """
T{tool}
G92 E0
"""
end = """
G1 Z10 F3000 ; raise Z
G28 X0 Y0 ; home X Y
M104 S0 ; heater off
M84 ; motors off
"""

# Text from any installed font (`img2gcode fonts` lists them), placed on the
# canvas in mm, independently of the image. Repeat the block for more text.
# With no image at all, the job is just the text. A single-line font
# ("Relief SingleLine", built in, or an SVG font file's path) draws each
# letter as strokes followed once; bold and infill do not apply to it.
#
# [[text]]
# content = "Rowan Wuz Here"   # "\n" starts a new line
# font = "Arial Black"         # family or face name, sans-serif / serif / monospace, or a single-line font
# size = 40.0                  # mm, the font size (capitals are ~0.7 of it)
# x = 0.0                      # mm, centre of the text block
# y = -250.0
# bold = false
# italic = false
# infill = true                # false = outlines only
# tool = 0
# width = 0.0                  # mm; wrap words onto new lines to fit, 0 = off
# align = "center"             # left, center or right
